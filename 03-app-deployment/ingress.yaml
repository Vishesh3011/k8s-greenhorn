apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app-deployment
spec:
  ingressClassName: nginx
  rules:
    - host: test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          - path: /api/node
            pathType: Prefix
            backend:
              service:
                name: api-node-service
                port:
                  number: 3000

          - path: /api/go
            pathType: Prefix
            backend:
              service:
                name: api-golang-service
                port:
                  number: 8000