apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-golang
  namespace: app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-golang
  template:
    metadata:
      labels:
        app: api-golang
    spec:
      containers:
        - name: api-golang
          image: vishesh3011/api-golang
          env:
            - name: DATABASE_URL_FILE
              value: /etc/secrets/DATABASE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: db-secret-volume
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: db-secret-volume
          secret:
            secretName: db-secret