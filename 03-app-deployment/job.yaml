apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: app-deployment
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: postgres:15
          command:
            - sh
            - -c
            - |
              psql $DATABASE_URL <<EOF
              CREATE TABLE IF NOT EXISTS public.request (
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                api_name VARCHAR(10) NOT NULL CHECK (api_name IN ('node', 'go'))
              );
              EOF
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 3